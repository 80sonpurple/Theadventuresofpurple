<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;

body {

h1 {

}

/* =========================
   PAGES
========================= */

.page {
  display: none;
  height: calc(100dvh - 140px);
  overflow-y: auto;
  padding: 15px;
}

.page.active {
  display: block;
}

/* =========================
   SECTIONS
========================= */

.section {
  background: black;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 12px;
}

.section h2 {
  color: white;
  margin: 0 0 10px 0;
}

/* =========================
   BUTTONS
========================= */

button {
  width: 100%;
  padding: 12px;
  margin: 5px 0;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: url('https://emojicdn.elk.sh/🪄'), auto;
}

.game {
  background: magenta;
  color: blue;
}

.special {
  background: orange;
  color: blue;
}

.summary {
  background: yellow;
  color: blue;
}

.achievements {
  background: black;
  color: blue;
  border: 2px solid blue;
}

/* =========================
   NAVIGATION
========================= */

.nav {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 20px;
  z-index: 10;
}

.nav button {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: red;
  color: blue;
  font-size: 28px;
}

/* =========================
   SETTINGS
========================= */

.settings {
  position: fixed;
  right: 10px;
  bottom: 10px;
  background: black;
  color: blue;
  padding: 10px;
  border-radius: 10px;
  z-index: 10;
}

/* =========================
   FULL-SCREEN VIEWER
========================= */

.viewer {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100dvh;
  background: black;
  display: none;
  z-index: 1000;
}

.viewer.active {
  display: flex;
  flex-direction: column;
}

/* Large game/document area */

#frame {
  display: block;
  width: 100%;
  height: calc(100dvh - 55px);
  flex: 1;
  border: none;
  background: black;
}

/* =========================
   VIEWER CONTROL BAR
========================= */

.viewer-controls {
  width: 100%;
  height: 55px;
  min-height: 55px;
  background: #222;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px 10px;
}

/* Aspect ratio */

.aspect-control {
  color: white;
  font-size: 14px;
}

.aspect-control input {
  width: auto;
  margin-right: 5px;
}

/* Back button */

.back {
  position: static;
  width: auto;
  margin: 0;
  padding: 9px 16px;
  background: blue;
  color: yellow;
  border-radius: 8px;
  font-size: 15px;
}

/* =========================
   MOBILE ADJUSTMENTS
========================= */

@media (max-width: 600px) {

  .page {
    height: calc(100dvh - 120px);
    padding: 10px;
  }

  .section {
    padding: 12px;
  }

  button {
    padding: 14px 10px;
    font-size: 15px;
  }

  .nav {
    bottom: 5px;
    gap: 10px;
  }

  .nav button {
    width: 50px;
    height: 50px;
    font-size: 22px;
  }

  .settings {
    display: none;
  }

  .viewer-controls {
    height: 50px;
    min-height: 50px;
  }

  #frame {
    height: calc(100dvh - 50px);
  }
}

<script>

let page = 1;

function show(p) {

  for(let i = 1; i <= 5; i++) {
    document.getElementById("p" + i).classList.remove("active");
  }

  document.getElementById("p" + p).classList.add("active");

  page = p;
}

function next() {
  page++;

  if(page > 5) {
    page = 1;
  }

  show(page);
}

function prev() {
  page--;

  if(page < 1) {
    page = 5;
  }

  show(page);
}

function openGame(id) {

  const frame = document.getElementById("frame");

  viewer.classList.add("active");

}


/* =========================
   CLOSE GAME
========================= */

function closeGame() {

  const frame = document.getElementById("frame");
  const viewer = document.getElementById("viewer");

  viewer.classList.remove("active");

  document.getElementById("viewerAspectRatio").checked = false;
